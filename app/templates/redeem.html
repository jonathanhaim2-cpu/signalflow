{% extends "base.html" %}
{% block title %}מימוש קוד — SignalFlow{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-6 py-20 text-center">
  <h1 class="text-2xl font-bold mb-3">מימוש קוד פרו</h1>
  <p class="font-mono text-2xl tracking-wider mb-6" dir="ltr">{{ code }}</p>
  {% if logged_in %}
    {% if ok %}
    <p class="text-emerald-300 mb-6">{{ message }}</p>
    <a href="/dashboard" class="inline-block px-5 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 font-semibold">לערוץ שלי</a>
    {% else %}
    <p class="text-red-300 mb-6">{{ message }}</p>
    <a href="/dashboard" class="inline-block px-5 py-2 rounded-lg border border-slate-700">חזרה</a>
    {% endif %}
  {% else %}
    <p class="text-slate-300 mb-6 leading-relaxed">{{ message }}</p>
    <div class="flex justify-center gap-3 flex-wrap">
      <a href="/signup?next={{ next }}" class="px-5 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 font-semibold">הרשמה</a>
      <a href="/login?next={{ next }}" class="px-5 py-2 rounded-lg border border-slate-700 hover:border-slate-500 font-semibold">כניסה</a>
    </div>
  {% endif %}
</div>
{% endblock %}
